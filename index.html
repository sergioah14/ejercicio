
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página oficial de Bukhi. Conoce al artista y descubre su música.">
    <title>BUKHI | Página oficial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SECCIÓN PRINCIPAL -->
    <header class="hero" id="inicio" aria-label="Inicio de Bukhi">

        <main class="container">

            <h1>BUKHI</h1>

            <nav aria-label="Navegación principal">

                <a href="canciones.html"
                   class="button"
                   aria-label="Ir a Mis Canciones">
                    Mis Canciones
                </a>

                <a href="#sobre-mi"
                   class="button"
                   aria-label="Conocer más sobre Bukhi">
                    Sobre mí
                </a>

            </nav>

        </main>

    </header>


    <!-- SECCIÓN SOBRE MÍ -->
    <section class="about-section"
             id="sobre-mi"
             aria-labelledby="titulo-sobre-mi">

        <div class="about-content">

            <!-- FOTOGRAFÍA -->
            <div class="about-image">

                <img
                    src="foto.jpeg"
                    alt="Fotografía de Bukhi, artista musical."
                    title="Foto de Bukhi"
                    loading="lazy"
                >

            </div>

            <!-- DESCRIPCIÓN -->
            <div class="about-text">

                <h2 id="titulo-sobre-mi">
                    Sobre Mí
                </h2>

                <p>
                    AQUÍ VA TU DESCRIPCIÓN.
                    Cuéntale al mundo quién eres,
                    qué haces y qué te inspira.
                </p>

            </div>

        </div>

    </section>

</body>
</html>
